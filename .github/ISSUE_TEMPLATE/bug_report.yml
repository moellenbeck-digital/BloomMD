name: Bug Report
description: Report something that is broken in BloomMD.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web
        - Desktop
        - Mobile
        - Obsidian plugin
        - Templates
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, commit SHA, or browser build
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, device, screen size
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Do not paste private Markdown content unless it is safe to share publicly.
