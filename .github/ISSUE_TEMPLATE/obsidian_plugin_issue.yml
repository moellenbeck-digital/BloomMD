name: Obsidian Plugin Issue
description: Report a problem with BloomMD for Obsidian.
title: "[Obsidian]: "
labels: ["bug", "desktop"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: obsidian_version
    attributes:
      label: Obsidian version
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: privacy
    attributes:
      label: Privacy note
      description: Do not paste private vault content unless it is safe to share publicly.
