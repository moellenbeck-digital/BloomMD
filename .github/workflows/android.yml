name: Android

# Native build of the BloomMD Android app (Capacitor): debug APK, JVM unit tests of the folder plugin
# and an emulator self-test on pull requests; a signed AAB for Google Play on tags (mobile-v*) or by
# hand. Uploads go to the Play *internal testing* track only, never to production.
on:
  pull_request:
    paths:
      - packages/mobile/**
      - packages/capacitor-folder/**
      - packages/ui/**
      - packages/ink/**
      - packages/core/**
      - bun.lock
      - .github/workflows/android.yml
  push:
    tags:
      - mobile-v*
  workflow_dispatch:
    inputs:
      release:
        description: Build the signed release AAB (and upload it to internal testing when the Play secret exists)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BLOOMMD_ANDROID_VERSION_CODE: ${{ github.run_number }}

jobs:
  debug:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also installs the legacy `tools` package, which current SDK managers no longer offer.
          packages: platform-tools
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests (app)
        id: unit
        working-directory: packages/mobile
        run: bun run test
      - name: Build web assets with the emulator self-test
        id: web
        working-directory: packages/mobile
        env:
          VITE_BLOOMMD_SELFTEST: "1"
        run: bun run build
      - name: Sync Capacitor Android project
        id: sync
        working-directory: packages/mobile
        run: bunx cap sync android
      - name: Debug APK and Kotlin unit tests (folder plugin)
        id: gradle
        working-directory: packages/mobile/android
        run: ./gradlew --no-daemon assembleDebug :bloommd-capacitor-folder:testDebugUnitTest
      - name: Free disk space for the emulator
        # The runner has ~6 GB left after the build; the tablet image needs more for its data partition.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h "$HOME"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the self-test on an Android tablet emulator
        id: selftest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash packages/mobile/scripts/android-selftest.sh packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/android-selftest.png"
      - name: Keep the APK and the emulator screenshot
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug
          path: |
            packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/android-selftest.png
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        working-directory: packages/mobile
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node scripts/ci-summary.mjs --title "Android: debug build and self-test (tablet emulator)" \
            --step unit="Unit tests (app)" \
            --step web="Web assets with the self-test" \
            --step sync="Capacitor Android sync" \
            --step gradle="Debug APK and Kotlin unit tests (folder plugin)" \
            --step selftest="Self-test on the Android tablet emulator" \
            --step upload="Artifact upload (APK and emulator screenshot)" \
            --artifact-name android-debug --artifact-file "$GITHUB_WORKSPACE/packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk" --artifact-step upload \
            --artifact-missing "the Gradle build did not produce app-debug.apk (see the build step above)." \
            --extra "the phone form factor (the self-test runs on a tablet emulator only)" \
            --extra "the signed release bundle and the Google Play upload (release job, tags only)" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also installs the legacy `tools` package, which current SDK managers no longer offer.
          packages: platform-tools
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build web assets
        working-directory: packages/mobile
        run: bun run build
      - name: Sync Capacitor Android project
        working-directory: packages/mobile
        run: bunx cap sync android
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key secrets: building an unsigned AAB, nothing is uploaded to Google Play."
          fi
          if [ -n "$PLAY" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; else echo "play=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release AAB
        working-directory: packages/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease :bloommd-capacitor-folder:testReleaseUnitTest
      - name: Verify the AAB signature
        if: steps.signing.outputs.signed == 'true'
        run: jarsigner -verify packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Keep the AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play internal testing
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.bloommd.mobile
          releaseFiles: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
