name: CI

# Public fork pull requests run tests with a read-only token. Private GHCR image
# publishing is handled by a maintainer workflow in the private archive.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: "Run the full E2E suite for this manually selected ref"
        required: false
        default: false
        type: boolean
      run_release_artifacts:
        description: "Build CLI, sync and Obsidian release artifacts"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.filter.outputs.critical }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_FULL_E2E: ${{ inputs.run_full_e2e }}
          RUN_RELEASE_ARTIFACTS: ${{ inputs.run_release_artifacts }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$GITHUB_SHA")"
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA")"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed_files=""
          else
            changed_files="$(git ls-files)"
          fi

          critical=false
          release=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              apps/app/**|apps/app/e2e/**|apps/marketing/**|apps/marketing/e2e/**|packages/core/**|packages/ui/**|packages/agent-runtime/**|packages/wiki-cli/**|packages/sync/**|plugins/openclaw/**|deploy/openclaw/**|scripts/**|.github/workflows/ci.yml|.github/workflows/desktop.yml|Dockerfile|package.json|bun.lock|tsconfig.base.json)
                critical=true
                ;;
            esac
            case "$path" in
              packages/agent-runtime/**|packages/wiki-cli/**|packages/sync/**|plugins/obsidian/**|plugins/openclaw/**|packages/core/**|package.json|bun.lock|.github/workflows/ci.yml|.github/workflows/cli-release.yml)
                release=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$RUN_FULL_E2E" == "true" ]] && critical=true
            [[ "$RUN_RELEASE_ARTIFACTS" == "true" ]] && release=true
          fi

          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "critical=$critical release=$release"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOOMMD_AUTH_SECRET: ci-only-auth-secret-that-is-long-and-random
      BLOOMMD_REQUIRE_AUTH: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3211
      # CI sends no Plausible server signal; the plausible spec toggles this itself.
      BLOOMMD_PLAUSIBLE_DISABLED: "true"
      # Throwaway database below; tests/integration/*-db.integration.test.ts fail in CI without it.
      BLOOMMD_TEST_DATABASE_URL: postgres://bloommd:bloommd-ci-only@localhost:5432/bloommd_test
    services:
      # Same image tag as deploy/local/docker-compose.yml. Database and credentials exist only for the
      # lifetime of this job and are not secrets.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bloommd
          POSTGRES_PASSWORD: bloommd-ci-only
          POSTGRES_DB: bloommd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloommd -d bloommd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'plugins/obsidian/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Verify Bun version matches packageManager
        run: |
          set -euo pipefail
          expected="$(jq -r .packageManager package.json | cut -d@ -f2)"
          echo "bun --version: $(bun --version) (packageManager: $expected)"
          test "$(bun --version)" = "$expected"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Obsidian plugin dependencies
        working-directory: plugins/obsidian
        run: bun install --frozen-lockfile
      - name: Audit workspace dependencies
        # GHSA-gcqx-w48m-w2h4 (deepmerge <= 4.3.1, low, prototype pollution in mergeObject()) has no fixed
        # release (4.3.1 is the latest) and comes in through payload (apps/cms), which merges its own
        # configuration with it. Re-check when deepmerge releases a fix, then drop the ignore.
        run: bun audit --ignore GHSA-gcqx-w48m-w2h4
      - name: Audit Obsidian plugin dependencies
        working-directory: plugins/obsidian
        run: bun audit
      - name: Typecheck all surfaces
        run: bun run typecheck
      - name: Migrate test database
        env:
          DATABASE_URL: ${{ env.BLOOMMD_TEST_DATABASE_URL }}
        run: bun run --cwd apps/app db:migrate
      - name: Migrate test database again (must be idempotent)
        env:
          DATABASE_URL: ${{ env.BLOOMMD_TEST_DATABASE_URL }}
        run: bun run --cwd apps/app db:migrate
      - name: Run unit tests
        run: bun run test
      - name: DB tests ran without skips
        # Second run on the already used database (order/isolation check); the counts go into a
        # notice annotation on the run, and a skipped or missing DB test fails the job.
        run: |
          set -euo pipefail
          bun test tests/integration/*-db.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/db-tests.log"
          count() { { grep -E "^ *[0-9]+ $1\$" "$RUNNER_TEMP/db-tests.log" || true; } | awk '{print $1}' | tail -1; }
          pass="$(count pass)"; skip="$(count skip)"; fail="$(count fail)"
          echo "::notice title=DB tests::pass=${pass:-0} skip=${skip:-0} fail=${fail:-0}"
          test "${pass:-0}" -gt 0
          test "${skip:-0}" -eq 0
      - name: CMS DB tests ran without skips
        # The CMS tests create a database of their own on the service above (the user may create
        # databases) and run the real migrations; a skipped or missing DB test fails the job.
        working-directory: apps/cms
        run: |
          set -euo pipefail
          bun test src/testing/svc.db.test.ts 2>&1 | tee "$RUNNER_TEMP/cms-db-tests.log"
          count() { { grep -E "^ *[0-9]+ $1\$" "$RUNNER_TEMP/cms-db-tests.log" || true; } | awk '{print $1}' | tail -1; }
          pass="$(count pass)"; skip="$(count skip)"; fail="$(count fail)"
          echo "::notice title=CMS DB tests::pass=${pass:-0} skip=${skip:-0} fail=${fail:-0}"
          test "${pass:-0}" -gt 0
          test "${skip:-0}" -eq 0
      - name: Validate M1 QA matrix and test plan
        run: bun run test:qa
      - name: Build web
        working-directory: apps/app
        run: bun run build
      - name: Build marketing
        working-directory: apps/marketing
        run: bun run build
      - name: Node version of the job is the pinned one
        # Payload's engine is ^22.23.4; .nvmrc is the single pin (setup-node reads it, the CMS image copies it).
        run: test "$(node --version)" = "v$(cat .nvmrc)"
      - name: Build the CMS for production, start it under Node and probe the routes
        # Spike rest of #204: production build and `next start` under the pinned Node, peak memory of the
        # build, the route inventory against the running service, a signed /svc/v1 call and the build info in
        # the admin UI. The numbers go into the notice below.
        working-directory: apps/cms
        env:
          CMS_BUILD_HEAP_MB: "4096"
        run: |
          set -euo pipefail
          bun run scripts/verify-production.ts 2>&1 | tee "$RUNNER_TEMP/cms-production.log"
          echo "::notice title=CMS production build and start::$(grep '^SUMMARY' "$RUNNER_TEMP/cms-production.log")"
      - name: Build mobile web assets
        working-directory: packages/mobile
        run: bun run build
      - name: Build desktop renderer
        working-directory: packages/desktop
        run: bun run build:renderer
      - name: Build and smoke-test OpenClaw workspace-agent image
        run: |
          set -euo pipefail
          bun run --cwd plugins/openclaw package:release
          package_file="$(find artifacts/openclaw-plugin -maxdepth 1 -type f -name 'bloommd-openclaw-plugin-*.tgz' -print -quit)"
          test -n "$package_file"
          docker build --file deploy/openclaw/Dockerfile --tag bloommd-openclaw-plugin:ci .
          docker volume create bloommd-openclaw-ci-state >/dev/null
          docker run --rm \
            --mount type=volume,source=bloommd-openclaw-ci-state,target=/home/node/.openclaw \
            bloommd-openclaw-plugin:ci bloommd --help | tee /tmp/bloommd-openclaw-help.txt
          grep -Fq "openclaw bloommd" /tmp/bloommd-openclaw-help.txt
          grep -Fq "pair" /tmp/bloommd-openclaw-help.txt
          docker run --rm \
            --mount type=bind,source="$PWD/artifacts/openclaw-plugin",target=/plugin,readonly \
            --entrypoint /bin/sh \
            bloommd-openclaw-plugin:ci \
            -c 'archive="$(find /plugin -maxdepth 1 -name "bloommd-openclaw-plugin-*.tgz" -print -quit)"; test -n "$archive"; OPENCLAW_ENTRYPOINT=/app/openclaw.mjs /opt/bloommd-plugin/scripts/install-plugin.sh "$archive" --force; node /app/openclaw.mjs bloommd --help' \
            | tee /tmp/bloommd-openclaw-archive-help.txt
          grep -Fq "openclaw bloommd" /tmp/bloommd-openclaw-archive-help.txt
      - name: Verify Bun version and size in container images
        run: |
          set -euo pipefail
          expected="$(jq -r .packageManager package.json | cut -d@ -f2)"
          docker build --file deploy/openclaw/Dockerfile --target plugin-build --tag bloommd-openclaw-plugin-build:ci .
          docker build --file Dockerfile --target deps --tag bloommd-app-deps:ci .
          docker build --file Dockerfile --target cms --tag bloommd-cms:ci .
          for image in bloommd-openclaw-plugin-build:ci bloommd-app-deps:ci bloommd-cms:ci; do
            actual="$(docker run --rm --entrypoint bun "$image" --version)"
            echo "$image: bun --version $actual"
            test "$actual" = "$expected"
          done
          # The CMS image runs on the pinned Node (not Bun), and without configuration it refuses to start.
          cms_node="$(docker run --rm --entrypoint node bloommd-cms:ci --version)"
          echo "bloommd-cms:ci: node --version $cms_node (pinned: v$(cat .nvmrc))"
          test "$cms_node" = "v$(cat .nvmrc)"
          if docker run --rm bloommd-cms:ci > "$RUNNER_TEMP/cms-start.log" 2>&1; then
            echo "The CMS image started without configuration"; exit 1
          fi
          grep -Fq "BloomMD CMS configuration is incomplete" "$RUNNER_TEMP/cms-start.log"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^bloommd-' | sort
          echo "::notice title=bun --version in images::plugin-build=$(docker run --rm --entrypoint bun bloommd-openclaw-plugin-build:ci --version) app-deps=$(docker run --rm --entrypoint bun bloommd-app-deps:ci --version) runner=$(bun --version)"

  full-e2e:
    runs-on: ubuntu-latest
    # Full E2E is an independent final gate. Running it beside verify keeps main's wall time
    # bounded by the slower gate.
    needs: changes
    if: >-
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.critical == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_full_e2e == true)
      )
    timeout-minutes: 30
    env:
      BLOOMMD_AUTH_SECRET: ci-only-auth-secret-that-is-long-and-random
      BLOOMMD_REQUIRE_AUTH: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3211
      # CI sends no Plausible server signal; the plausible spec toggles this itself.
      BLOOMMD_PLAUSIBLE_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'plugins/obsidian/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      # PackageKit is not needed in CI. In runs 42179754419 (touch-views) and 42179754589
      # (full-e2e) all 6 attempts of `apt-get install -y --no-install-recommends libasound2t64 ...`
      # hung for 120 s, and in each of them a packagekitd (/usr/libexec/packagekitd) that had started
      # seconds before ran next to the stuck apt-get. Jobs without it installed in 10 to 21 s (#307).
      # The cause inside apt is not proven: if a hang still happens, the annotation names wchan,
      # children and lock owners.
      - name: Stop PackageKit before apt runs
        timeout-minutes: 2
        run: sudo systemctl mask --now packagekit.service || echo "::warning title=PackageKit::could not mask packagekit.service"
      # Two steps instead of `playwright install --with-deps`: the browser cache above only covers
      # the browser download, while the apt part runs on every job. Each part retries on its own, and
      # only for network or package-source errors (3 attempts, 120 s each, 15 s pause). A hang is cut
      # off per attempt instead of eating the whole 10 minutes; every failed attempt is a
      # ::warning:: in the log with the last apt error line, and the last failure is a hard red
      # (#141). A cut-off attempt does not stop the root-owned apt-get: it keeps the dpkg lock, and an
      # immediate retry failed with "Unable to acquire the dpkg frontend lock". In runs 42172271748
      # and 42178351349 that apt-get was the one of the first attempt itself, still running after
      # 385 s, next to a packagekitd (#307). With --lock-wait the system-dependencies step ends the
      # apt processes a failed attempt left behind (never dpkg), waits up to 120 s before every
      # attempt until apt/dpkg is idle, and names every process in a warning. Worst case
      # 3 x (120 s wait + 120 s attempt + 5 s ending) + 2 x 15 s pause = 765 s, hence the 15-minute
      # step limit. The cache key is the same as in mobile.yml (one Playwright version, set by
      # bun.lock), so a run on main fills the cache for both workflows.
      - name: Install Playwright system dependencies
        working-directory: apps/app
        timeout-minutes: 15
        run: >-
          "$GITHUB_WORKSPACE/scripts/ci-retry-network.sh"
          --label "Playwright system dependencies" --attempts 3 --timeout 120 --pause 15 --lock-wait 120
          -- ./node_modules/.bin/playwright install-deps chromium
      - name: Install Playwright browser
        working-directory: apps/app
        timeout-minutes: 10
        run: >-
          "$GITHUB_WORKSPACE/scripts/ci-retry-network.sh"
          --label "Playwright browser download" --attempts 3 --timeout 120 --pause 15
          -- ./node_modules/.bin/playwright install chromium
      # Eats its own cooking: the repository's own Markdown goes through the checks BloomMD ships.
      # A broken link in our docs should fail our pipeline, not just other people's.
      - name: Lint repository Markdown
        run: bun run packages/wiki-cli/src/index.ts workspace lint docs --format github

      - name: Build app production server for end-to-end tests
        working-directory: apps/app
        env:
          PLAYWRIGHT_SERVER_MODE: production
          BLOOMMD_E2E_AUTH_BYPASS: "1"
          BLOOMMD_E2E_TEST_MODE: "1"
          BLOOMMD_LOCAL_DEPLOYMENT: "1"
          BLOOMMD_REQUIRE_AUTH: "1"
          NEXT_PUBLIC_SITE_URL: http://localhost:3211
          NEXT_PUBLIC_APP_URL: http://localhost:3211
          NEXT_PUBLIC_MARKETING_URL: https://bloommd.io
        run: bun run build
      - name: Run app Chromium end-to-end tests
        working-directory: apps/app
        env:
          PLAYWRIGHT_SERVER_MODE: production
          BLOOMMD_E2E_TEST_MODE: "1"
        run: >-
          bun run test:e2e --
          --project=chromium
          --project=chromium-mobile
          e2e/accessibility.spec.ts
          e2e/auth-shortcuts.spec.ts
          e2e/theme-custom.spec.ts
          e2e/release-contracts.spec.ts
          e2e/mobile-smoke.spec.ts
          e2e/workspace-agent-node.spec.ts
          e2e/link-preview-abuse-t210.spec.ts
      # Plausible tracking (#299): the spec starts the production build above twice with different env
      # (tracking on, then BLOOMMD_PLAUSIBLE_DISABLED=true) and a local counterpart, so it needs no rebuild.
      # The default run above cannot cover it: its servers run in E2E test mode, which switches tracking off.
      - name: Run Plausible tracking end-to-end tests
        working-directory: apps/app
        env:
          PLAYWRIGHT_SERVER_MODE: production
        run: bun run test:e2e:plausible
      - name: Reclaim Docker disk before workspace-agent end-to-end test
        # GitHub-hosted runners arrive with preloaded images and BuildKit cache. The isolated
        # stack needs several large images at the same time (app, sync, Postgres, OpenClaw and
        # model stub), so reclaim that unrelated space before its build rather than after it has
        # already exhausted the runner disk. This is intentionally CI-only: local runs must not
        # delete a developer's unrelated Docker resources.
        run: |
          docker system prune --all --force --volumes
          docker builder prune --all --force
      - name: Run OpenClaw workspace-agent Docker end-to-end test
        # This covers the actual plugin image, pairing, realtime task wake, agent isolation,
        # human proposal application through sync and token revocation. It uses a deterministic
        # test model, so CI never requires an external model credential.
        run: bun run test:e2e:agent
      - name: Reclaim Docker disk after workspace-agent end-to-end test
        # The isolated stack builds the OpenClaw image alongside the app, sync, Postgres and
        # model-stub images. Remove those throwaway layers before Playwright starts Marketing;
        # GitHub-hosted runners otherwise run out of disk despite Compose tearing down volumes.
        run: docker system prune --all --force --volumes
      - name: Run marketing accessibility end-to-end tests
        working-directory: apps/marketing
        run: bun run test:e2e -- --project=chromium e2e/accessibility.spec.ts
      - name: Build marketing production server for release end-to-end tests
        working-directory: apps/marketing
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3211
          NEXT_PUBLIC_MARKETING_URL: http://localhost:3211
          NEXT_PUBLIC_APP_URL: https://bloommd.app
          # The script only loads on the configured domain; this server is reached as localhost.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: localhost
          NEXT_PUBLIC_PLAUSIBLE_SRC: /_plausible/js/script.js
          NEXT_PUBLIC_PLAUSIBLE_API_HOST: /_plausible
          NEXT_PUBLIC_DESKTOP_MACOS_ARM64_DOWNLOAD_URL: https://bloommd.io/_desktop-updates/stable-macos-arm64-BloomMD.dmg
          BLOOMMD_REQUIRE_AUTH: "1"
          BLOOMMD_WAITLIST_ADMIN_USER: admin
          BLOOMMD_WAITLIST_ADMIN_PASSWORD: secret
        run: bun run build
      - name: Verify the Plausible values in the marketing bundle
        working-directory: apps/marketing
        env:
          # Must match the build step above: the check compares the baked-in domain with this value.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: localhost
        run: bun run verify:plausible-build
      - name: Run marketing production end-to-end tests
        working-directory: apps/marketing
        env:
          PLAYWRIGHT_SERVER_MODE: production
        run: >-
          bun run test:e2e --
          --project=chromium
          --project=chromium-mobile
          e2e/release-contracts.spec.ts
          e2e/waitlist-noindex.spec.ts
          e2e/mobile-smoke.spec.ts
      # Separate run: the default E2E server keeps the beta gate off for local development.
      # This run turns it on and proves the invitation boundary itself.
      - name: Build app production server for closed-beta end-to-end tests
        working-directory: apps/app
        env:
          PLAYWRIGHT_SERVER_MODE: production
          BLOOMMD_E2E_AUTH_BYPASS: "1"
          BLOOMMD_E2E_TEST_MODE: "1"
          BLOOMMD_LOCAL_DEPLOYMENT: "1"
          BLOOMMD_REQUIRE_AUTH: "1"
          BLOOMMD_BETA_ACCESS: "1"
          BLOOMMD_BETA_ALLOWED_EMAILS: invited@bloommd.local,@partner.test
          BLOOMMD_BETA_INVITE_CODES: beta-e2e-code
          NEXT_PUBLIC_SITE_URL: http://localhost:3411
          NEXT_PUBLIC_APP_URL: http://localhost:3411
          NEXT_PUBLIC_MARKETING_URL: http://127.0.0.1:3212
        run: bun run build
      - name: Run closed-beta gate end-to-end tests
        working-directory: apps/app
        env:
          PLAYWRIGHT_SERVER_MODE: production
        run: bun run test:e2e:beta
      # Separate run: the Wiki suite needs a server with the public Wiki enabled, and the main run
      # asserts it stays disabled. Next also refuses a second `next dev` for one project.
      - name: Run Wiki end-to-end tests
        working-directory: apps/app
        run: bun run test:e2e:wiki

  release-artifacts:
    runs-on: ubuntu-latest
    needs:
      - verify
      - changes
    if: >-
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_release_artifacts == true)
      )
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'plugins/obsidian/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Obsidian plugin dependencies
        working-directory: plugins/obsidian
        run: bun install --frozen-lockfile
      - name: Build agent, Wiki and sync release binaries
        run: bun run build:release-artifacts
      - name: Smoke-test native Bun single binaries
        run: |
          set -euo pipefail
          artifacts/bloommd-agent-linux-x64 --help | grep -Fq 'bloommd-agent'
          artifacts/bloommd-wiki-linux-x64 --help | grep -Fq 'bloommd-wiki'
      - name: Package and verify Obsidian plugin
        working-directory: plugins/obsidian
        # CI artifacts are beta builds for the touch matrix itself; public releases through the mirror
        # still require MOBILE-MATRIX.md to verify the exact version.
        env:
          BLOOMMD_ALLOW_UNVERIFIED_MOBILE: "1"
        run: bun run release:package
      - name: Package OpenClaw workspace-agent plugin
        working-directory: plugins/openclaw
        run: bun run package:release
      - name: Verify OpenClaw package contents
        run: |
          set -euo pipefail
          package_file="$(find artifacts/openclaw-plugin -maxdepth 1 -type f -name 'bloommd-openclaw-plugin-*.tgz' -print -quit)"
          test -n "$package_file"
          tar -tzf "$package_file" | grep -Fx 'package/openclaw.plugin.json'
          tar -tzf "$package_file" | grep -Fx 'package/dist/index.js'
          tar -tzf "$package_file" | grep -Fx 'package/skills/bloommd-workspace-agent/SKILL.md'
      - name: Upload Obsidian release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bloommd-obsidian
          path: plugins/obsidian/release/
          if-no-files-found: error
      - name: Upload OpenClaw workspace-agent artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bloommd-openclaw-plugin
          path: artifacts/openclaw-plugin/*.tgz
          if-no-files-found: error
      - name: Upload agent, Wiki and sync release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bloommd-command-binaries
          path: |
            artifacts/bloommd-agent-*
            artifacts/bloommd-wiki-*
            artifacts/bloommd-sync
          if-no-files-found: error
