name: iOS Release

# Signed Release archive of the BloomMD iPad/iPhone app and upload to App Store Connect
# (TestFlight). Never runs on pull requests: only by hand or for a `mobile-v<version>` tag.
# Without credentials the workflow ends green with a notice instead of failing.
#
# The Apple team ID and App Store Connect API key are loaded from the configured
# secret provider or explicitly selected repository secrets.
#   APPLE_TEAM_ID                     10-character team ID
#   APPLE_API_KEY_ID                  key ID of the team App Store Connect API key
#   APPLE_API_ISSUER_ID               issuer ID shown above the key list
#   APPLE_API_PRIVATE_KEY_P8_BASE64   the AuthKey_<id>.p8, base64-encoded (GitHub fallback; in 1Password
#                                     the item "BloomMD Release CI" holds the .p8 file itself)
# credential_source=github (manual runs only) reads the same four names as repository secrets
# instead: the explicit emergency fallback, as in desktop-release.yml.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight (off: only archive, sign and keep the .ipa as artifact)"
        type: boolean
        default: true
      credential_source:
        description: "Signing source (GitHub only as explicit emergency fallback)"
        required: true
        default: onepassword
        type: choice
        options:
          - onepassword
          - github
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      source: ${{ steps.check.outputs.source }}
    steps:
      - id: check
        env:
          CREDENTIAL_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.credential_source == 'github' && 'github' || 'onepassword' }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          echo "source=$CREDENTIAL_SOURCE" >> "$GITHUB_OUTPUT"
          # 1Password (default): only the service-account token lives in GitHub; missing fields in
          # the vault fail the load step loudly instead of skipping.
          required=(OP_SERVICE_ACCOUNT_TOKEN)
          if [ "$CREDENTIAL_SOURCE" = "github" ]; then
            required=(APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY_P8_BASE64)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            message="iOS release skipped: missing secrets ${missing[*]} (credential source: $CREDENTIAL_SOURCE). See docs/MOBILE-APP.md, section Veröffentlichung."
            echo "::notice title=iOS release skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  archive:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Version from package.json
        id: version
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "mobile-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/mobile/package.json version $version (expected mobile-v$version)"
            exit 1
          fi
          bun scripts/ios-version.ts --check
          # Build number = run number of this workflow: grows with every run, so every upload of
          # the same marketing version is accepted by App Store Connect.
          bun scripts/ios-version.ts --write --build "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_OUTPUT"
      - name: Unit tests
        working-directory: packages/mobile
        run: bun run test
      - name: Build web assets (no self-test)
        working-directory: packages/mobile
        env:
          VITE_BLOOMMD_SELFTEST: ""
        run: bun run build
      - name: Sync Capacitor iOS project
        working-directory: packages/mobile
        run: bunx cap sync ios
      - name: Load App Store Connect credentials from 1Password
        id: asc-secrets
        if: ${{ needs.secrets.outputs.source != 'github' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: false
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.BLOOMMD_OP_REF_APPLE_TEAM_ID }}
          # Team key with Admin role (cloud-managed distribution signing), item "BloomMD Release CI" in
          # vault BloomMD CI. Desktop notarization keeps its own key in "Apple Notarization".
          APPLE_API_KEY_ID: ${{ secrets.BLOOMMD_OP_REF_IOS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.BLOOMMD_OP_REF_APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.BLOOMMD_OP_REF_APPLE_API_PRIVATE_KEY_P8 }}
      - name: App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_KEY_ID || steps.asc-secrets.outputs.APPLE_API_KEY_ID }}
          # GitHub fallback: base64 secret. 1Password: the .p8 file attached to the item, as plain text.
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 || '' }}
          APPLE_API_PRIVATE_KEY_P8: ${{ needs.secrets.outputs.source != 'github' && steps.asc-secrets.outputs.APPLE_API_PRIVATE_KEY_P8 || '' }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_API_KEY_ID" ] || { echo "::error::APPLE_API_KEY_ID is empty"; exit 1; }
          key="$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "$(dirname "$key")"
          if [ -n "$APPLE_API_PRIVATE_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::APPLE_API_PRIVATE_KEY_P8_BASE64 does not contain a .p8 private key"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Xcode 26 or newer
        run: |
          set -euo pipefail
          # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; App Store Connect needs Xcode 26 or later"; exit 1; }
      # The archive stays unsigned: automatic signing during archive asks for an iOS Development
      # profile, which Apple only issues for a team with registered devices. The export step signs
      # with the App Store distribution certificate and profile (created via -allowProvisioningUpdates),
      # which needs no device. The app has no entitlements file, so nothing is lost.
      - name: Archive (Release, unsigned; signed on export)
        working-directory: packages/mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_TEAM_ID || steps.asc-secrets.outputs.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_KEY_ID || steps.asc-secrets.outputs.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_ISSUER_ID || steps.asc-secrets.outputs.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BloomMD.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/archive.log" 2>&1 && status=0 || status=$?
          grep -E "error:|warning: .*[Ss]ign|ARCHIVE" "$RUNNER_TEMP/archive.log" || true
          if [ "$status" -ne 0 ]; then tail -60 "$RUNNER_TEMP/archive.log"; exit "$status"; fi
      - name: Check the archived app
        working-directory: packages/mobile
        run: scripts/check-ios-release.sh "$RUNNER_TEMP/BloomMD.xcarchive" "$GITHUB_RUN_NUMBER"
      - name: Export and upload to App Store Connect
        working-directory: packages/mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_TEAM_ID || steps.asc-secrets.outputs.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_KEY_ID || steps.asc-secrets.outputs.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ needs.secrets.outputs.source == 'github' && secrets.APPLE_API_ISSUER_ID || steps.asc-secrets.outputs.APPLE_API_ISSUER_ID }}
          BLOOMMD_VERSION: ${{ steps.version.outputs.BLOOMMD_VERSION }}
          MARKETING_VERSION: ${{ steps.version.outputs.MARKETING_VERSION }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.CURRENT_PROJECT_VERSION }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$options"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$options"
          if [ "$UPLOAD" != "true" ]; then plutil -replace destination -string export "$options"; fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BloomMD.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          {
            echo "### BloomMD iOS $BLOOMMD_VERSION"
            echo "App Store version **$MARKETING_VERSION**, build **$CURRENT_PROJECT_VERSION**, commit \`${GITHUB_SHA::7}\`."
            if [ "$UPLOAD" = "true" ]; then
              echo "Uploaded to App Store Connect. After processing it appears under TestFlight for internal testers; external testing and App Store release stay manual."
            else
              echo "Dry run: signed .ipa kept as workflow artifact, nothing uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the signed .ipa (dry run)
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bloommd-ios-${{ steps.version.outputs.BLOOMMD_VERSION }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
