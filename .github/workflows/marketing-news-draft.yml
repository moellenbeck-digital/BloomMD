name: Prepare marketing news draft

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-draft:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create bilingual news draft
        run: bun run --cwd apps/marketing news:draft

      - name: Open review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- apps/marketing/content/news; then
            echo "No news draft changes to publish."
            exit 0
          fi
          branch="automation/news-${RUN_ID}"
          git checkout -b "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/marketing/content/news
          git commit -m "chore(marketing): prepare ${RELEASE_TAG} news draft"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(marketing): prepare ${RELEASE_TAG} news draft" \
            --body "Automatisch aus Release **${RELEASE_TITLE}** erzeugter Draft. Bitte DE/EN redaktionell prüfen, ergänzen und erst danach veröffentlichen."
