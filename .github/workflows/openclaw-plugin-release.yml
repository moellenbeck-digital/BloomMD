name: OpenClaw plugin release

on:
  push:
    tags:
      - "openclaw-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing openclaw-v<version> tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: openclaw-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(node -p 'require("./plugins/openclaw/package.json").version')"
          runtime_version="$(node -p 'require("./packages/agent-runtime/package.json").version')"
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "$release_tag" = "openclaw-v${plugin_version}"
          test "$plugin_version" = "$runtime_version"
          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
      - name: Package and verify plugin
        working-directory: plugins/openclaw
        run: bun run package:release
      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find artifacts/openclaw-plugin -maxdepth 1 -type f -name 'bloommd-openclaw-plugin-*.tgz' -print -quit)"
          test -n "$package_file"
          tar -tzf "$package_file" | grep -Fx 'package/openclaw.plugin.json'
          tar -tzf "$package_file" | grep -Fx 'package/dist/index.js'
          tar -tzf "$package_file" | grep -Fx 'package/skills/bloommd-workspace-agent/SKILL.md'
          tar -tzf "$package_file" | grep -Fx 'package/LICENSE'
          tar -tzf "$package_file" | grep -Fx 'package/LICENSE-MIT-legacy'
      - name: Publish GitHub plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/openclaw-plugin/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "BloomMD OpenClaw Plugin ${RELEASE_TAG#openclaw-}" \
            --notes "Install the archive through the BloomMD OpenClaw guide. This beta plugin only processes explicitly assigned workspace tasks." \
            --prerelease
