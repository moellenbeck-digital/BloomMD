    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".46"/></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/><g fill="#fff" opacity=".3"><circle cx="120" cy="162" r="3"/><circle cx="315" cy="120" r="3"/><circle cx="1360" cy="170" r="3"/><circle cx="1480" cy="730" r="3"/><circle cx="210" cy="760" r="3"/></g>
