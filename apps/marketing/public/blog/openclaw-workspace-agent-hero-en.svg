    <rect x="735" y="190" width="196" height="260" rx="36" fill="#201C19" stroke="#8A5A45" stroke-width="2"/><rect x="765" y="236" width="136" height="112" rx="23" fill="#4A281B"/><rect x="785" y="262" width="96" height="67" rx="17" fill="#2B1B16" stroke="#FF8B5C" stroke-width="4"/><circle cx="815" cy="295" r="7" fill="#FF8B5C"/><circle cx="850" cy="295" r="7" fill="#FF8B5C"/><path d="M811 316h43" stroke="#FF8B5C" stroke-width="5" stroke-linecap="round"/><text x="752" y="398" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Local agent</text>
