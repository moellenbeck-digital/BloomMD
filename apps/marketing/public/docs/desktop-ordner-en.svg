<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Diagram: BloomMD desktop with an opened folder</title>
  <desc id="desc">Schematic sketch, not a screenshot: the file list of the opened folder on the left, the resulting map with headings as nodes on the right.</desc>
  <rect width="1200" height="640" rx="24" fill="#FAF8F5"/>
  <rect x="40" y="40" width="1120" height="560" rx="16" fill="#fff" stroke="#D4CFC8" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="52" rx="16" fill="#EFEBE6"/>
  <circle cx="72" cy="66" r="8" fill="#E5604D"/><circle cx="98" cy="66" r="8" fill="#E8B13C"/><circle cx="124" cy="66" r="8" fill="#5BB85D"/>
  <text x="600" y="73" text-anchor="middle" fill="#5F574F" font-family="Arial, sans-serif" font-size="20">BloomMD</text>
  <rect x="40" y="92" width="280" height="508" fill="#FAF8F5" stroke="#E8E4DF" stroke-width="2"/>
  <rect x="64" y="116" width="232" height="48" rx="10" fill="#B64A1F"/>
  <text x="180" y="147" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Your folder</text>
  <text x="64" y="212" fill="#8A8178" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">FILES</text>
  <rect x="56" y="230" width="248" height="40" rx="8" fill="#FFF1EA"/>
  <text x="76" y="257" fill="#8A3518" font-family="Arial, sans-serif" font-size="19" font-weight="700">Graph theory.md</text>
  <text x="76" y="303" fill="#3B352F" font-family="Arial, sans-serif" font-size="19">Storage.md</text>
  <text x="76" y="343" fill="#3B352F" font-family="Arial, sans-serif" font-size="19">Chapter 1.md</text>
  <g fill="none" stroke="#CFC8C0" stroke-width="3">
    <path d="M560 360C640 360 650 250 740 250"/><path d="M560 360C640 360 650 360 740 360"/><path d="M560 360C640 360 650 470 740 470"/>
  </g>
  <rect x="380" y="320" width="180" height="80" rx="16" fill="#1D1D1D" stroke="#FF6B35" stroke-width="4"/>
  <text x="470" y="368" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Graph theory</text>
  <rect x="740" y="225" width="200" height="50" rx="12" fill="#B64A1F"/><text x="840" y="257" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">Definition</text>
  <rect x="740" y="335" width="200" height="50" rx="12" fill="#B64A1F"/><text x="840" y="367" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">References</text>
  <rect x="740" y="445" width="200" height="50" rx="12" fill="#B64A1F"/><text x="840" y="477" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">Examples</text>
  <text x="1140" y="582" text-anchor="end" fill="#8A8178" font-family="Arial, sans-serif" font-size="16">Diagram – not a screenshot</text>
