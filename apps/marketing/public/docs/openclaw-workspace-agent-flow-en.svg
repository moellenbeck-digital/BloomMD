<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">BloomMD OpenClaw: local agent with human approval</title><desc id="desc">A selected node is assigned to a local OpenClaw agent. The agent returns a proposal that only a person can apply.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171513"/><stop offset="1" stop-color="#30201a"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".24"/></filter></defs>
  <rect width="1600" height="800" rx="36" fill="url(#bg)"/>
  <text x="100" y="116" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">BloomMD × OpenClaw</text><text x="100" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Local agent. You decide.</text>
  <g filter="url(#shadow)">
    <rect x="96" y="286" width="310" height="226" rx="25" fill="#1E1E1E" stroke="#FF6B35" stroke-width="6"/><circle cx="139" cy="335" r="18" fill="#FF6B35"/><text x="133" y="342" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">1</text><text x="170" y="342" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Selected</text><text x="134" y="415" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Sync check</text><text x="134" y="456" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="20">This node only</text>
    <path d="M406 399H512" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/><path d="M488 375l28 24-28 24" fill="none" stroke="#FF6B35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="532" y="256" width="360" height="286" rx="25" fill="#221E1B" stroke="#62412F" stroke-width="2"/><circle cx="575" cy="309" r="18" fill="#4A281B"/><text x="569" y="316" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="17" font-weight="700">2</text><text x="606" y="316" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Processed locally</text><text x="565" y="387" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">OpenClaw</text><text x="565" y="431" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="21">Claims only assigned nodes.</text><rect x="565" y="462" width="224" height="46" rx="23" fill="#153D31"/><text x="589" y="492" fill="#7DE2B8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Model only on assignment</text>
    <path d="M892 399H998" stroke="#FF6B35" stroke-width="7" stroke-linecap="round"/><path d="M974 375l28 24-28 24" fill="none" stroke="#FF6B35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1018" y="256" width="476" height="286" rx="25" fill="#221E1B" stroke="#FF6B35" stroke-width="3"/><circle cx="1061" cy="309" r="18" fill="#FF6B35"/><text x="1055" y="316" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">3</text><text x="1092" y="316" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Approval required</text><text x="1058" y="387" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Review proposal</text><text x="1058" y="426" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="21">You apply it or discard it.</text><rect x="1058" y="458" width="270" height="46" rx="23" fill="#332018"/><text x="1083" y="488" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Your decision stays visible</text>
  </g>
  <text x="100" y="658" fill="#D7D0CB" font-family="Arial, sans-serif" font-size="26">The agent never writes directly. Every step stays traceable and reversible in the workspace.</text>
</svg>
