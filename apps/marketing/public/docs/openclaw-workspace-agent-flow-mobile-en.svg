<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1015" viewBox="0 0 560 1015" role="img" aria-labelledby="title desc">
  <title id="title">BloomMD OpenClaw: local agent with human approval</title><desc id="desc">A selected node is processed locally. Only a person decides whether to apply the proposal.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171513"/><stop offset="1" stop-color="#30201a"/></linearGradient></defs>
  <rect width="560" height="1015" rx="28" fill="url(#bg)"/>
  <text x="42" y="76" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BloomMD × OpenClaw</text><text x="42" y="118" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Local agent.</text><text x="42" y="154" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">You decide.</text>
  <rect x="42" y="208" width="476" height="174" rx="22" fill="#1E1E1E" stroke="#FF6B35" stroke-width="6"/><circle cx="74" cy="250" r="15" fill="#FF6B35"/><text x="69" y="256" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text><text x="102" y="256" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Selected</text><text x="72" y="316" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Sync check</text><text x="72" y="352" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">This node only</text>
  <path d="M280 382v64" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/><path d="M258 424l22 26 22-26" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="476" width="476" height="194" rx="22" fill="#221E1B" stroke="#62412F" stroke-width="2"/><circle cx="74" cy="518" r="15" fill="#4A281B"/><text x="69" y="524" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text><text x="102" y="524" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Processed locally</text><text x="72" y="584" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">OpenClaw</text><text x="72" y="624" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">Claims only assigned nodes.</text><rect x="72" y="636" width="224" height="30" rx="15" fill="#153D31"/><text x="90" y="657" fill="#7DE2B8" font-family="Arial, sans-serif" font-size="14" font-weight="700">Model only on assignment</text>
  <path d="M280 670v64" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/><path d="M258 712l22 26 22-26" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="764" width="476" height="176" rx="22" fill="#221E1B" stroke="#FF6B35" stroke-width="3"/><circle cx="74" cy="806" r="15" fill="#FF6B35"/><text x="69" y="812" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text><text x="102" y="812" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Approval required</text><text x="72" y="866" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Review proposal</text><text x="72" y="902" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">You decide whether to apply it.</text>
  <text x="42" y="976" fill="#D7D0CB" font-family="Arial, sans-serif" font-size="18">The agent never writes directly.</text><text x="42" y="1001" fill="#D7D0CB" font-family="Arial, sans-serif" font-size="18">Every step stays reviewable.</text>
</svg>
