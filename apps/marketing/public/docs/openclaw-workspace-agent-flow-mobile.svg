<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1015" viewBox="0 0 560 1015" role="img" aria-labelledby="title desc">
  <title id="title">BloomMD OpenClaw: lokaler Agent mit menschlicher Freigabe</title><desc id="desc">Ein ausgewählter Knoten wird lokal bearbeitet. Der Vorschlag wird erst nach menschlicher Freigabe übernommen.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171513"/><stop offset="1" stop-color="#30201a"/></linearGradient></defs>
  <rect width="560" height="1015" rx="28" fill="url(#bg)"/>
  <text x="42" y="76" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BloomMD × OpenClaw</text><text x="42" y="118" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Lokaler Agent.</text><text x="42" y="154" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Du entscheidest.</text>
  <rect x="42" y="208" width="476" height="174" rx="22" fill="#1E1E1E" stroke="#FF6B35" stroke-width="6"/><circle cx="74" cy="250" r="15" fill="#FF6B35"/><text x="69" y="256" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text><text x="102" y="256" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ausgewählt</text><text x="72" y="316" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Sync-Check</text><text x="72" y="352" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">Nur dieser Knoten</text>
  <path d="M280 382v64" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/><path d="M258 424l22 26 22-26" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="476" width="476" height="194" rx="22" fill="#221E1B" stroke="#62412F" stroke-width="2"/><circle cx="74" cy="518" r="15" fill="#4A281B"/><text x="69" y="524" fill="#FF8B5C" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text><text x="102" y="524" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Lokal bearbeitet</text><text x="72" y="584" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">OpenClaw</text><text x="72" y="624" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">Holt nur beauftragte Knoten ab.</text><rect x="72" y="636" width="220" height="30" rx="15" fill="#153D31"/><text x="90" y="657" fill="#7DE2B8" font-family="Arial, sans-serif" font-size="14" font-weight="700">Modell nur bei Auftrag</text>
  <path d="M280 670v64" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/><path d="M258 712l22 26 22-26" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="764" width="476" height="176" rx="22" fill="#221E1B" stroke="#FF6B35" stroke-width="3"/><circle cx="74" cy="806" r="15" fill="#FF6B35"/><text x="69" y="812" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text><text x="102" y="812" fill="#FFC5B0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Freigabe erforderlich</text><text x="72" y="866" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Vorschlag prüfen</text><text x="72" y="902" fill="#C9C1BB" font-family="Arial, sans-serif" font-size="18">Du entscheidest über die Übernahme.</text>
  <text x="42" y="976" fill="#D7D0CB" font-family="Arial, sans-serif" font-size="18">Der Agent schreibt nie direkt.</text><text x="42" y="1001" fill="#D7D0CB" font-family="Arial, sans-serif" font-size="18">Jeder Schritt bleibt prüfbar.</text>
</svg>
