<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <linearGradient id="bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
  </defs>

  <!-- Android adaptive icon: content in safe zone (66dp center of 108dp) -->
  <!-- Safe zone is roughly the center 60%, so ~130-302 in 432px -->
  
  <!-- Background (will be masked by Android) -->
  <rect width="432" height="432" fill="#FAFAFA"/>

  <!-- # Mark in safe zone -->
  <g transform="translate(144, 120)">
    <rect x="36" y="4" width="14" height="152" rx="7" fill="#1A1A1A"/>
    <rect x="88" y="4" width="14" height="152" rx="7" fill="#1A1A1A"/>
    <rect x="8" y="40" width="128" height="14" rx="7" fill="url(#bloom)"/>
    <rect x="8" y="100" width="128" height="14" rx="7" fill="url(#bloom)"/>
    <circle cx="136" cy="12" r="10" fill="url(#bloom)" opacity="0.85"/>
  </g>
</svg>
