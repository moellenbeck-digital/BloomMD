<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F8F8F8"/>
    </linearGradient>
  </defs>

  <!-- Background with iOS superellipse approximation -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- # Mark — centered -->
  <g transform="translate(272, 232)">
    <!-- Vertical strokes -->
    <rect x="128" y="16" width="56" height="432" rx="28" fill="#1A1A1A"/>
    <rect x="288" y="16" width="56" height="432" rx="28" fill="#1A1A1A"/>
    <!-- Horizontal strokes — orange bloom -->
    <rect x="16" y="120" width="440" height="56" rx="28" fill="url(#bloom)"/>
    <rect x="16" y="284" width="440" height="56" rx="28" fill="url(#bloom)"/>
    <!-- Bloom dot -->
    <circle cx="456" cy="40" r="36" fill="url(#bloom)" opacity="0.85"/>
  </g>
</svg>
