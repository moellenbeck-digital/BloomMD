<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    <filter id="macShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- macOS style: rounded rect with shadow -->
  <rect x="24" y="20" width="464" height="464" rx="96" fill="#FAFAFA" filter="url(#macShadow)" stroke="#E8E8E8" stroke-width="0.5"/>

  <!-- # Mark -->
  <g transform="translate(136, 118)">
    <rect x="62" y="8" width="28" height="216" rx="14" fill="#1A1A1A"/>
    <rect x="142" y="8" width="28" height="216" rx="14" fill="#1A1A1A"/>
    <rect x="8" y="60" width="220" height="28" rx="14" fill="url(#bloom)"/>
    <rect x="8" y="142" width="220" height="28" rx="14" fill="url(#bloom)"/>
    <circle cx="228" cy="20" r="18" fill="url(#bloom)" opacity="0.85"/>
  </g>
</svg>
