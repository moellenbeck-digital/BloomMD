<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#111"/>

  <!-- Orange glow -->
  <circle cx="600" cy="200" r="100" fill="#FF6B35" opacity="0.05"/>

  <!-- # Mark -->
  <g transform="translate(530, 120)">
    <rect x="36" y="4" width="14" height="120" rx="7" fill="#E0E0E0"/>
    <rect x="80" y="4" width="14" height="120" rx="7" fill="#E0E0E0"/>
    <rect x="8" y="32" width="118" height="14" rx="7" fill="url(#bloom)"/>
    <rect x="8" y="76" width="118" height="14" rx="7" fill="url(#bloom)"/>
    <circle cx="126" cy="10" r="10" fill="url(#bloom)" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="320" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F0F0F0" letter-spacing="-1">
    Bloom<tspan font-weight="400" fill="#888">MD</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#666" letter-spacing="2">
    MARKDOWN MIND MAPS — EVERYWHERE
  </text>

  <!-- URL -->
  <text x="600" y="500" text-anchor="middle" font-family="monospace" font-size="16" fill="#555">bloommd.app</text>
</svg>
