name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run release:verify
        env:
          BLOOMMD_REQUIRE_CLEAN_MIRROR: "1"
      - name: Verify exact version tag
        run: test "${GITHUB_REF_NAME}" = "$(node -p "require('./manifest.json').version")"
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            manifest.json
            main.js
            shared-runtime.js
            styles.css
            LICENSE
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            manifest.json
            main.js
            shared-runtime.js
            styles.css
            LICENSE
          body_path: CHANGELOG.md
